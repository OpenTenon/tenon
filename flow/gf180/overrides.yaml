# GF180 OCD IO cells retain their explicit four-rail connectivity in RTL.
# Avoid automatic hierarchy-breaking power reconnection and use the PDK
# template's Metal2 dummy-fill policy to satisfy whole-die density.
meta:
  version: 3
  flow: Chip
  substituting_steps:
    Odb.SetPowerConnections: null

VDD_NETS: [vdd, iovdd]
GND_NETS: [vss, iovss]
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
