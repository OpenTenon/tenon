name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .git/tenon/cache
            ~/.cache/pip
          key: tenon-v2-format-${{ runner.os }}-${{ hashFiles('tools/toolchain.json') }}
      - run: python3 scripts/ci_tools.py --group format
      - run: python3 scripts/engineering.py verify --group format
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-format
          path: build/verification/
          retention-days: 14

  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes iverilog
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .git/tenon/cache
            ~/.cache/pip
          key: tenon-v2-check-${{ runner.os }}-${{ hashFiles('tools/toolchain.json') }}
      - run: python3 scripts/ci_tools.py --group check
      - run: python3 scripts/ci_gate.py --event-only
      - run: python3 scripts/engineering.py verify --group check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-check
          path: build/verification/
          retention-days: 14

  sim:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes iverilog
      - run: python3 scripts/engineering.py verify --group sim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-sim
          path: build/verification/
          retention-days: 14

  tools-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/engineering.py verify --group tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-windows
          path: build/verification/
          retention-days: 14

  required:
    name: ci-required
    if: always()
    needs: [format, check, sim, tools-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require every job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
